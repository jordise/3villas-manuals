<html lang="es">
<!-- VERSIÓN ACTUAL: v04 | Historial completo al final de este archivo -->
<head>
  <base href="/intranet/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listado Guardias e Intervenciones v04 — 3Villas</title>
  <link rel="icon" type="image/png" href="https://www.3villas.com/intranet/icon-corazon-rojo-fondo-transparente.png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <script>
    // ── AUTO-DETECCIÓN DE VERSIÓN (Opción B) ──
    (function(){
      const PAGE_VERSION='v04';
      try{
        if(location.protocol==='file:') return;
        fetch(location.pathname,{cache:'reload'}).then(r=>r.text()).then(html=>{
          const m=html.match(/VERSIÓN ACTUAL:\s*(v\d+)/);
          if(!m) return;
          const serverVer=m[1];
          if(serverVer!==PAGE_VERSION){
            const flag='3v_vchk_'+location.pathname+'_'+serverVer;
            if(!sessionStorage.getItem(flag)){
              sessionStorage.setItem(flag,'1');
              location.reload();
            }
          }
        }).catch(()=>{});
      }catch(e){}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--red:#C8102E;--red-dark:#9e0c24;--red-light:#fce8eb;--green:#1e9e4e;--green-dark:#157039;--green-light:#e6f7ee;--orange:#e07b00;--orange-light:#fff4e0;--gray-1:#f4f5f7;--gray-2:#e8eaed;--gray-3:#c4c9d4;--gray-4:#7a8194;--gray-5:#2d3142;--shadow-sm:0 1px 4px rgba(0,0,0,.08);--shadow-md:0 4px 14px rgba(0,0,0,.11);--shadow-lg:0 8px 28px rgba(0,0,0,.13);--r:10px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Open Sans',sans-serif;background:var(--gray-1);color:var(--gray-5);min-height:100vh;padding-bottom:60px}
    h1,h2,h3{font-family:'Montserrat',sans-serif}
    a{color:inherit}
    /* ── NAV ── */
    nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;background:#fff;padding:10px 16px;box-shadow:var(--shadow-sm)}
    nav img{height:26px}
    .wp-nav-center{flex:1;text-align:center}
    .wp-nav-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px;color:var(--gray-5)}
    .wp-nav-sub{font-size:11px;color:var(--gray-4)}
    .wp-nav-btns{display:flex;align-items:center;gap:10px}
    .wp-nav-user{font-size:12px;color:var(--gray-4);display:flex;align-items:center;gap:4px}
    .wp-nav-menu,.wp-nav-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--gray-5);padding:4px 8px;border-radius:6px}
    .wp-nav-menu:hover,.wp-nav-close:hover{background:var(--gray-1)}
    /* ── FILTROS ── */
    #filterPanel{background:#fff;padding:10px 16px;box-shadow:var(--shadow-sm);position:sticky;top:46px;z-index:40}
    .main-bar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
    #fBuscar{height:34px;border:1px solid var(--gray-3);border-radius:8px;padding:0 12px;font-size:13px;min-width:160px}
    .pill-group{display:flex;flex-direction:column;gap:3px}
    .pill-label{font-size:10px;color:var(--gray-4);font-weight:600;text-transform:uppercase}
    .pill-opts{display:flex;gap:4px}
    .pill-opt{border:1px solid var(--gray-3);background:#fff;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--gray-4);font-weight:600}
    .pill-opt.on{background:var(--red);border-color:var(--red);color:#fff}
    .btn-mas{border:1px solid var(--gray-3);background:#fff;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--gray-5)}
    .btn-mas .arr{transition:transform .2s}
    .btn-mas.open .arr{transform:rotate(180deg)}
    .btn-clear{border:none;background:none;font-size:16px;cursor:pointer;color:var(--gray-4);padding:6px}
    #masFiltros{max-height:0;overflow:hidden;transition:max-height .25s ease}
    #masFiltros.open{max-height:400px}
    .mas-inner{padding-top:10px;display:flex;flex-direction:column;gap:10px}
    .filter-row{display:flex;gap:10px;flex-wrap:wrap}
    .form-group{display:flex;flex-direction:column;gap:3px}
    .f-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:130px}
    .f-group.narrow{flex:0 0 130px}
    .f-group.wide{flex:1 1 220px}
    .f-label{font-size:10px;color:var(--gray-4);font-weight:600;text-transform:uppercase}
    .f-input,.f-select{height:34px;border:1px solid var(--gray-3);border-radius:8px;padding:0 10px;font-size:12px;width:100%}
    .flag-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray-5);cursor:pointer}
    .manager-panel{position:fixed;background:#fff;border:1.5px solid var(--red);border-radius:8px;box-shadow:var(--shadow-lg);z-index:9999;display:none;flex-direction:column;max-height:300px;min-width:220px}
    .manager-list{overflow-y:auto;flex:1;padding:4px 0}
    .manager-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:13px;color:var(--gray-5);transition:background .1s}
    .manager-item:hover{background:var(--gray-1)}
    .manager-item input[type=checkbox]{pointer-events:none}
    /* ── MES ── */
    .month-nav{display:flex;align-items:center;gap:2px;background:var(--gray-1);border-radius:8px;padding:2px;height:34px}
    .month-btn{border:none;background:none;width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:16px;color:var(--gray-5);font-weight:700;line-height:1}
    .month-btn:hover{background:var(--gray-2)}
    .month-label{border:none;background:none;font-family:'Montserrat',sans-serif;font-weight:700;font-size:13px;color:var(--gray-5);padding:0 8px;cursor:pointer;min-width:130px;text-align:center}
    .month-label:hover{color:var(--red)}
    /* ── STATS ── */
    #statsBar{display:flex;gap:16px;padding:8px 16px;font-size:12px;color:var(--gray-4);flex-wrap:wrap}
    #statsBar strong{color:var(--gray-5)}
    /* ── TABLA RESUMEN ── */
    main{padding:0 16px}
    .state-box{text-align:center;padding:60px 20px;color:var(--gray-4)}
    .spinner{width:56px;height:56px;margin:0 auto 12px;display:block}
    #tableWrap{overflow-x:auto;background:#fff;border-radius:var(--r);box-shadow:var(--shadow-sm);margin-bottom:16px}
    .report-table{width:100%;border-collapse:collapse;font-size:12px}
    .report-table th,.report-table td{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--gray-2)}
    .report-table thead th{position:sticky;top:0;background:var(--gray-5);color:#fff;font-family:'Montserrat',sans-serif;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;z-index:5}
    .report-table td.num,.report-table th.num{text-align:center}
    .report-table tbody tr:nth-child(even){background:var(--gray-1)}
    .report-table tbody tr:hover{background:var(--red-light)}
    .report-table tr.row-total{background:var(--red-light);font-weight:800;color:var(--red-dark)}
    .report-table tr.row-total td{border-top:2px solid var(--red);position:sticky;bottom:0}
    .tipos-cell{white-space:normal;min-width:160px}
    .tipo-line{line-height:1.5}
    .tipo-line+.tipo-line{margin-top:1px}
    .row-total .tipo-line{color:var(--red-dark)}
  </style>
</head>
<body>

<nav>
  <a href="index.html"><img src="https://www.3villas.com/intranet/logo-negro.png" alt="3Villas"></a>
  <div class="wp-nav-center">
    <div class="wp-nav-title">Listado Guardias e Intervenciones</div>
    <div class="wp-nav-sub" id="hSub"></div>
  </div>
  <div class="wp-nav-btns">
    <div class="wp-nav-user">👤 <span id="hUserName"></span></div>
    <button class="wp-nav-menu" onclick="NavComponent.open()" title="Menú">☰</button>
    <button class="wp-nav-close" onclick="history.back()" title="Volver">✕</button>
  </div>
</nav>

<div id="filterPanel">
  <div class="main-bar">
    <input type="text" id="fBuscar" placeholder="Buscar" autocomplete="off">
    <div class="month-nav">
      <button class="month-btn" onclick="prevMonth()" title="Mes anterior">‹</button>
      <button class="month-label" id="monthLabel" onclick="thisMonth()" title="Ir al mes actual">—</button>
      <button class="month-btn" onclick="nextMonth()" title="Mes siguiente">›</button>
    </div>
    <div class="pill-group">
      <span class="pill-label">Estado</span>
      <div class="pill-opts">
        <button class="pill-opt on" id="eAll">Todas</button>
        <button class="pill-opt" id="ePend">Pendientes</button>
        <button class="pill-opt" id="eDone">Terminadas</button>
      </div>
    </div>
    <div style="flex:1"></div>
    <button class="btn-mas" id="btnMas" onclick="toggleMas()"><span>Filtros</span><span class="arr">▾</span></button>
    <button class="btn-clear" onclick="clearAll()" title="Limpiar">✕</button>
  </div>

  <div id="masFiltros">
    <div class="mas-inner">
      <div class="filter-row">
        <div class="form-group" style="flex-direction:row;align-items:center;gap:16px">
          <label class="flag-check"><input type="checkbox" id="fImportante"> 🚩 Importante</label>
          <label class="flag-check"><input type="checkbox" id="fUrgente"> 🏁 Urgente</label>
        </div>
      </div>
      <div class="filter-row">
        <div class="f-group narrow"><label class="f-label">Desde (fecha exacta)</label><input type="date" id="fDesde" class="f-input"></div>
        <div class="f-group narrow"><label class="f-label">Hasta (fecha exacta)</label><input type="date" id="fHasta" class="f-input"></div>
      </div>
      <div class="filter-row">
        <div class="f-group wide" style="position:relative">
          <label class="f-label">Villa Manager</label>
          <button id="fUserBtn" class="f-select" onclick="toggleUserPanel(event)" style="text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between">
            <span id="fUserLabel">Todos</span><span style="font-size:10px;color:var(--gray-4)">▾</span>
          </button>
          <div id="userPanel" class="manager-panel" style="display:none">
            <div style="padding:8px 10px;border-bottom:1px solid var(--gray-2)">
              <input type="text" id="userSearch" class="f-input" placeholder="Buscar usuario..." oninput="filterUserList()" style="height:30px;font-size:12px">
            </div>
            <div id="userList" class="manager-list"></div>
            <div style="padding:6px 10px;border-top:1px solid var(--gray-2);display:flex;gap:8px">
              <button id="btnSelectAll" class="btn-clear" style="font-size:11px;color:var(--gray-4)">Todos</button>
              <button id="btnClearUsers" class="btn-clear" style="font-size:11px;color:var(--red)">Ninguno</button>
            </div>
          </div>
        </div>
      </div>
      <div class="filter-row">
        <div class="f-group">
          <label class="f-label">Villa</label>
          <input type="text" id="fVilla" class="f-input" list="villasList" placeholder="Nombre de villa..." oninput="onVillaChange()" onchange="onVillaChange()">
          <datalist id="villasList"></datalist>
        </div>
        <div class="f-group narrow"><label class="f-label">Nº Tarea</label><input type="number" id="fTaskId" class="f-input" placeholder="ej. 1042" min="1" step="1"></div>
        <div class="f-group narrow"><label class="f-label">Id Reserva</label><input type="text" id="fReserva" class="f-input" placeholder="ej. j5oQcmp4FQ"></div>
        <div class="f-group narrow">
          <label class="f-label">Tipo de intervención</label>
          <select id="fTipo" class="f-select"><option value="">— Todos —</option></select>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="statsBar">
  <div><strong id="sGuardiasCnt">0</strong> guardias</div>
  <div><strong id="sIntervCnt">0</strong> intervenciones</div>
  <div><strong id="sDespCnt">0</strong> desplazamientos</div>
</div>

<script>
(function(){
'use strict';

Auth.require('listado-guardias-e-intervenciones');
var session = Auth.getSession ? Auth.getSession() : null;
var myUserId = (session && session.payload && (session.payload.UserID || session.payload.userId)) || '';
var myRole = Auth.role();
var myUserName = Auth.name();

var WORKER='https://caspio-proxy.jordi-89b.workers.dev';
var VIEW='Vi_TaTasks_villas_user_mu';

function g(id){return document.getElementById(id);}
function val(id){return (g(id)||{}).value||'';}
function pad2(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function toast(msg,type){var t=g('toast');t.textContent=msg;t.className=type||'';t.style.display='block';clearTimeout(window._toastTO);window._toastTO=setTimeout(function(){t.style.display='none';},3000);}
function esc(s){return (s||'').toString().replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function isFlagOn(v){if(!v)return false;var s=String(v).toLowerCase().trim();return['1','yes','sí','si','true','on','-1'].includes(s);}
function monthLbl(d){var s=d.toLocaleDateString('es-ES',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1);}

var allVillas=[], allUsers=[], allUsersMap={}, tiposMap={}, allTipos=[];
var selectedManagers={};
var estadoFilter='all';
var currentRows=[];
var viewMonth=new Date(); viewMonth.setDate(1); viewMonth.setHours(0,0,0,0);

/* ── Carga inicial de lookups (idéntico patrón a guardias-e-intervenciones.html) ── */
function loadVillas(){
  return fetch(Auth.url(WORKER+'?action=data&table=TaVillas&limit=500')).then(function(r){return r.json();}).then(function(json){
    var rows=json.Result||json.result||[];
    allVillas=rows.map(function(v){return{id:String(v.villaid),name:v.Name_villa_para_inquilinos||v.Name||'Villa '+v.villaid};}).sort(function(a,b){return a.name.localeCompare(b.name);});
    g('villasList').innerHTML=allVillas.map(function(v){return '<option value="'+esc(v.name)+'">';}).join('');
  });
}
function loadUsers(){
  return fetch(Auth.url(WORKER+'?action=data&table=TaUsers&limit=200')).then(function(r){return r.json();}).then(function(json){
    var rows=json.Result||json.result||[];
    allUsers=rows.map(function(u){return{id:u.UserID,name:u.Name||u.UserID,email:u.Email||''};}).sort(function(a,b){return a.name.localeCompare(b.name);});
    allUsers.forEach(function(u){allUsersMap[u.id]=u.name;});
    if(!myUserId){
      var myEmail=Auth.email?Auth.email():'';
      var me=allUsers.find(function(u){return (u.email||'').toLowerCase()===myEmail.toLowerCase();});
      if(me) myUserId=me.id;
    }
    renderUserList();
  });
}
function loadTipos(){
  return fetch(Auth.url(WORKER+'?action=data&table=Ta_tipo_intervencion_guardia&limit=100')).then(function(r){return r.json();}).then(function(json){
    var rows=json.Result||json.result||[];
    allTipos=rows.map(function(t){return{id:t.Intervencion_guardia_tipo_ID,name:t.Nombre};});
    allTipos.forEach(function(t){tiposMap[t.id]=t.name;});
    var opts='<option value="">— Todos —</option>'+allTipos.map(function(t){return '<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>';}).join('');
    g('fTipo').innerHTML=opts;
  });
}

/* ── Filtro de Villa Manager (multi-select) — mismo patrón que guardias-e-intervenciones.html ── */
function renderUserList(filter){
  var list=g('userList'); if(!list) return;
  var q=(filter||'').toLowerCase();
  var myMgrId=myUserId||'';
  var items=allUsers.slice().sort(function(a,b){
    if(a.id===myMgrId) return -1; if(b.id===myMgrId) return 1;
    return a.name.localeCompare(b.name,'es',{sensitivity:'base'});
  });
  if(q) items=items.filter(function(u){return u.name.toLowerCase().indexOf(q)!==-1;});
  var prevScroll=list.scrollTop;
  list.innerHTML=items.map(function(u){
    var isCurrent=(u.id===myMgrId);
    var style=isCurrent?'background:var(--red-light)':'';
    var marker=isCurrent?'<span style="font-size:9px;color:var(--red);font-weight:800;margin-left:6px">← tú</span>':'';
    return '<div class="manager-item" data-mid="'+esc(u.id)+'" style="'+style+'"><input type="checkbox" id="uc_'+esc(u.id)+'" '+(selectedManagers[u.id]?'checked':'')+'><label for="uc_'+esc(u.id)+'">'+esc(u.name)+marker+'</label></div>';
  }).join('');
  list.querySelectorAll('.manager-item').forEach(function(item){
    item.addEventListener('click',function(e){
      e.stopPropagation();
      var uid=item.dataset.mid;
      if(selectedManagers[uid]) delete selectedManagers[uid]; else selectedManagers[uid]=true;
      var scrollTop=list.scrollTop;
      renderUserList((g('userSearch')||{}).value||'');
      list.scrollTop=scrollTop;
      updateUserLabel(); scheduleFetch();
    });
  });
  list.scrollTop=prevScroll;
}
function filterUserList(){ renderUserList((g('userSearch')||{}).value||''); }
function selectAllUsers(){ allUsers.forEach(function(u){selectedManagers[u.id]=true;}); renderUserList(); updateUserLabel(); scheduleFetch(); }
function clearUsersSel(){ selectedManagers={}; renderUserList(); updateUserLabel(); scheduleFetch(); }
function updateUserLabel(){
  var keys=Object.keys(selectedManagers);
  var lbl=g('fUserLabel'); if(!lbl) return;
  if(keys.length===0) lbl.textContent='Todos';
  else if(keys.length===1){ var nm=allUsersMap[keys[0]]||keys[0]; lbl.textContent=nm.length>25?nm.slice(0,23)+'…':nm; }
  else lbl.textContent=keys.length+' managers';
}
window.toggleUserPanel=function(e){
  e&&e.stopPropagation();
  var panel=g('userPanel'), btn=g('fUserBtn');
  if(!panel||!btn) return;
  if(panel.style.display!=='none'){ panel.style.display='none'; return; }
  var rect=btn.getBoundingClientRect();
  panel.style.top=(rect.bottom+4)+'px';
  panel.style.left=rect.left+'px';
  panel.style.width=rect.width+'px';
  panel.style.display='flex';
  renderUserList();
  if(g('userSearch')){ g('userSearch').value=''; g('userSearch').focus(); }
};
document.addEventListener('click',function(e){
  var panel=g('userPanel');
  if(panel && panel.style.display!=='none' && !panel.contains(e.target) && e.target!==g('fUserBtn')) panel.style.display='none';
});
g('btnSelectAll').addEventListener('click',selectAllUsers);
g('btnClearUsers').addEventListener('click',clearUsersSel);

/* ── Villa (filtro de texto libre con datalist) ── */
window.onVillaChange=function(){scheduleFetch();};

/* ── Estado (Todas/Pendientes/Terminadas) — filtro solo de cliente, no refetch ── */
['eAll','ePend','eDone'].forEach(function(id){
  g(id).addEventListener('click',function(){
    estadoFilter = id==='eAll'?'all':(id==='ePend'?'pend':'done');
    ['eAll','ePend','eDone'].forEach(function(x){g(x).classList.toggle('on',x===id);});
    reprocess();
  });
});
g('fImportante').addEventListener('change',reprocess);
g('fUrgente').addEventListener('change',reprocess);

/* ── Toggle panel filtros ── */
window.toggleMas=function(){
  g('masFiltros').classList.toggle('open');
  g('btnMas').classList.toggle('open');
};

/* ── Selector de MES ── */
function applyMonth(){
  var first=new Date(viewMonth.getFullYear(),viewMonth.getMonth(),1);
  var last=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,0);
  g('fDesde').value=ymd(first);
  g('fHasta').value=ymd(last);
  g('monthLabel').textContent=monthLbl(viewMonth);
}
window.prevMonth=function(){ viewMonth.setMonth(viewMonth.getMonth()-1); applyMonth(); scheduleFetch(); };
window.nextMonth=function(){ viewMonth.setMonth(viewMonth.getMonth()+1); applyMonth(); scheduleFetch(); };
window.thisMonth=function(){ viewMonth=new Date(); viewMonth.setDate(1); viewMonth.setHours(0,0,0,0); applyMonth(); scheduleFetch(); };

/* Si el usuario edita Desde/Hasta a mano (dentro de Filtros), sincroniza la etiqueta del mes o marca "Rango personalizado" */
function syncMonthLabelFromDates(){
  var d=val('fDesde'), h=val('fHasta');
  if(d && h){
    var dd=new Date(d+'T00:00:00');
    if(!isNaN(dd)){
      var first=new Date(dd.getFullYear(),dd.getMonth(),1);
      var last=new Date(dd.getFullYear(),dd.getMonth()+1,0);
      if(d===ymd(first) && h===ymd(last)){
        viewMonth=first;
        g('monthLabel').textContent=monthLbl(viewMonth);
        return;
      }
    }
  }
  g('monthLabel').textContent='Rango personalizado';
}
g('fDesde').addEventListener('change',function(){ syncMonthLabelFromDates(); scheduleFetch(); });
g('fHasta').addEventListener('change',function(){ syncMonthLabelFromDates(); scheduleFetch(); });

/* ── Limpiar todo ── */
window.clearAll=function(){
  g('fBuscar').value='';g('fVilla').value='';
  g('fTaskId').value='';g('fReserva').value='';g('fTipo').value='';
  g('fImportante').checked=false;g('fUrgente').checked=false;
  selectedManagers={};renderUserList();updateUserLabel();
  estadoFilter='all';['eAll','ePend','eDone'].forEach(function(x){g(x).classList.toggle('on',x==='eAll');});
  viewMonth=new Date(); viewMonth.setDate(1); viewMonth.setHours(0,0,0,0);
  applyMonth();
  scheduleFetch();
};
g('fBuscar').addEventListener('input',scheduleFetch);
g('fTaskId').addEventListener('input',scheduleFetch);
g('fReserva').addEventListener('input',scheduleFetch);
g('fTipo').addEventListener('change',scheduleFetch);

/* ── buildWhere (idéntico a guardias-e-intervenciones.html: misma vista, mismos campos) ── */
function buildWhere(){
  var parts=["TaTasks_Intervencion_guardia_tipo_ID IS NOT NULL","TaTasks_Intervencion_guardia_tipo_ID<>''"];
  var tid=(val('fTaskId')||'').trim();
  if(tid && /^\d+$/.test(tid)){ parts.push('TaTasks_taskid='+parseInt(tid,10)); return parts.join(' AND '); }
  var keys=Object.keys(selectedManagers);
  if(keys.length>0){
    var ids=keys.map(function(k){return "'"+k+"'";});
    parts.push(ids.length===1?'TaTasks_UserID_asigned_alfanum='+ids[0]:'TaTasks_UserID_asigned_alfanum IN ('+ids.join(',')+')');
  }
  var desde=val('fDesde'), hasta=val('fHasta');
  if(desde) parts.push("(TaTasks_Data_to_be_done_fixed IS NULL OR TaTasks_Data_to_be_done_fixed>='"+desde+"T00:00:00')");
  if(hasta) parts.push("(TaTasks_Data_to_be_done_fixed IS NULL OR TaTasks_Data_to_be_done_fixed<='"+hasta+"T23:59:59')");
  var reserva=val('fReserva').trim();
  if(reserva) parts.push("TaTasks_Idreserva LIKE '%"+reserva.replace(/'/g,"''")+"%'");
  var tipo=val('fTipo');
  if(tipo) parts.push("TaTasks_Intervencion_guardia_tipo_ID='"+tipo.replace(/'/g,"''")+"'");
  var villaQ=val('fVilla').trim().toLowerCase();
  if(villaQ){
    var mids=allVillas.filter(function(v){return v.name.toLowerCase().indexOf(villaQ)!==-1;}).map(function(v){return v.id;});
    if(!mids.length) parts.push('TaTasks_villaid=-999');
    else if(mids.length===1) parts.push('TaTasks_villaid='+mids[0]);
    else parts.push('TaTasks_villaid IN ('+mids.join(',')+')');
  }
  var bq=(val('fBuscar')||'').trim().replace(/'/g,"''");
  if(bq) parts.push("TaTasks_buscar_en_textos LIKE '%"+bq+"%'");
  return parts.join(' AND ');
}

/* ── Búsqueda (refetch al servidor, debounced) ── */
var scheduleTO=null;
function scheduleFetch(){ clearTimeout(scheduleTO); scheduleTO=setTimeout(doSearch,300); }

function doSearch(){
  g('stLoad').style.display='block'; g('stEmpty').style.display='none'; g('stErr').style.display='none'; g('tableWrap').style.display='none';
  var where=buildWhere();
  var url=WORKER+'?action=view&view='+encodeURIComponent(VIEW)+'&where='+encodeURIComponent(where)+'&orderBy='+encodeURIComponent('TaTasks_taskid DESC')+'&limit=1000';
  fetch(Auth.url(url)).then(function(r){return r.json();}).then(function(json){
    currentRows=json.Result||json.result||[];
    reprocess();
  }).catch(function(err){
    g('stLoad').style.display='none';
    g('stErr').style.display='block';
    g('errMsg').textContent=err.message||'Error cargando el listado';
  });
}

/* ── reprocess: filtra en cliente (estado/importante/urgente) y agrega — sin volver a llamar al servidor ── */
function reprocess(){
  g('stLoad').style.display='none'; g('stErr').style.display='none';
  var filtered=currentRows.filter(function(r){
    var done=isFlagOn(r.TaTasks_Tarea_terminada);
    if(estadoFilter==='pend' && done) return false;
    if(estadoFilter==='done' && !done) return false;
    if(g('fImportante').checked && !isFlagOn(r.TaTasks_importante)) return false;
    if(g('fUrgente').checked && !isFlagOn(r.TaTasks_urgente)) return false;
    return true;
  });
  var groups=aggregate(filtered);
  groups.sort(function(a,b){
    if(a.monthSort!==b.monthSort) return a.monthSort<b.monthSort?-1:1;
    return a.mgrName.localeCompare(b.mgrName,'es',{sensitivity:'base'});
  });
  renderTable(groups);
}

/* ── Agregación: agrupa por Mes + Villa Manager ── */
function extractDateOnly(dt){
  if(!dt) return '';
  var m=String(dt).match(/^(\d{4}-\d{2}-\d{2})/);
  return m?m[1]:'';
}
function aggregate(rows){
  var groups={}, order=[];
  rows.forEach(function(r){
    var fechaRaw=extractDateOnly(r.TaTasks_Data_to_be_done_fixed);
    var monthKey='sin-fecha', monthSort='0000-00';
    if(fechaRaw){
      var d=new Date(fechaRaw+'T00:00:00');
      if(!isNaN(d)){ monthKey=d.getFullYear()+'-'+pad2(d.getMonth()+1); monthSort=monthKey; }
    }
    var mgrId=r.TaTasks_UserID_asigned_alfanum||'';
    var mgrName=allUsersMap[mgrId]||mgrId||'—';
    var key=monthKey+'|'+mgrName.trim().toLowerCase();
    if(!groups[key]){
      groups[key]={monthKey:monthKey,monthSort:monthSort,mgrName:mgrName,guardias:0,intervenciones:0,desplazamientos:0,porTipo:{}};
      order.push(key);
    }
    var grp=groups[key];
    var tipoId=r.TaTasks_Intervencion_guardia_tipo_ID||'';
    if(tipoId==='guardia sin intervencion'){
      grp.guardias++;
    } else {
      grp.intervenciones++;
      grp.porTipo[tipoId]=(grp.porTipo[tipoId]||0)+1;
    }
    if(isFlagOn(r.TaTasks_Desplazamientos)) grp.desplazamientos++;
  });
  return order.map(function(k){return groups[k];});
}
function monthKeyLabel(monthKey){
  if(monthKey==='sin-fecha') return 'Sin fecha';
  var parts=monthKey.split('-');
  var d=new Date(parseInt(parts[0],10),parseInt(parts[1],10)-1,1);
  return monthLbl(d);
}

/* ── Render de la tabla-resumen + fila de totales ── */
function tiposLinesHTML(porTipo, tiposCols){
  var lines=tiposCols.filter(function(t){return (porTipo[t.id]||0)>0;})
    .map(function(t){return '<div class="tipo-line"><strong>'+(porTipo[t.id]||0)+'</strong> '+esc(t.name)+'</div>';});
  return lines.length ? lines.join('') : '—';
}
function renderTable(rows){
  var tiposCols=allTipos.filter(function(t){return t.id!=='guardia sin intervencion';});

  g('reportThead').innerHTML='<tr><th>Mes</th><th>Villa Manager</th><th class="num">Nº guardias</th><th class="num">Nº intervenciones</th><th class="num">Desplazamientos</th><th>Tipos</th></tr>';

  if(!rows.length){
    g('reportTbody').innerHTML='';
    g('tableWrap').style.display='none';
    g('stEmpty').style.display='block';
    g('sGuardiasCnt').textContent='0'; g('sIntervCnt').textContent='0'; g('sDespCnt').textContent='0';
    return;
  }
  g('stEmpty').style.display='none';
  g('tableWrap').style.display='block';

  var totals={guardias:0,intervenciones:0,desplazamientos:0,porTipo:{}};
  var bodyHtml=rows.map(function(r){
    totals.guardias+=r.guardias; totals.intervenciones+=r.intervenciones; totals.desplazamientos+=r.desplazamientos;
    tiposCols.forEach(function(t){ totals.porTipo[t.id]=(totals.porTipo[t.id]||0)+(r.porTipo[t.id]||0); });
    return '<tr><td>'+esc(monthKeyLabel(r.monthKey))+'</td><td>'+esc(r.mgrName)+'</td>'
      + '<td class="num">'+(r.guardias||'—')+'</td>'
      + '<td class="num">'+(r.intervenciones||'—')+'</td>'
      + '<td class="num">'+(r.desplazamientos||'—')+'</td>'
      + '<td class="tipos-cell">'+tiposLinesHTML(r.porTipo,tiposCols)+'</td></tr>';
  }).join('');

  bodyHtml += '<tr class="row-total"><td colspan="2">TOTALES</td>'
    + '<td class="num">'+totals.guardias+'</td>'
    + '<td class="num">'+totals.intervenciones+'</td>'
    + '<td class="num">'+totals.desplazamientos+'</td>'
    + '<td class="tipos-cell">'+tiposLinesHTML(totals.porTipo,tiposCols)+'</td></tr>';

  g('reportTbody').innerHTML=bodyHtml;

  g('sGuardiasCnt').textContent=totals.guardias;
  g('sIntervCnt').textContent=totals.intervenciones;
  g('sDespCnt').textContent=totals.desplazamientos;
}

/* ── Init ── */
Promise.all([loadVillas(),loadUsers(),loadTipos()]).then(function(){
  applyMonth();
  doSearch();
}).catch(function(err){
  g('stLoad').style.display='none';
  g('stErr').style.display='block';
  g('errMsg').textContent=err.message||'Error cargando datos iniciales';
});

})();
</script>

<!-- HISTORIAL: v04 - FIX bug reportado por Jordi (con captura): mismo Villa Manager, mismo mes, apareciendo en DOS filas en vez de una (ya con la fecha correcta, confirmando que el fix de fechas de v03 funcionó — el problema era otro). Causa: aggregate() agrupaba por monthKey+'|'+mgrId (el ID interno TaTasks_UserID_asigned_alfanum), no por el nombre mostrado; si dos tareas de la misma persona se guardaron con IDs de usuario ligeramente distintos (mayúsculas/minúsculas, o dos cuentas distintas para la misma persona), cada ID generaba su propio grupo aunque ambos resolvieran al mismo nombre en pantalla (allUsersMap[mgrId] daba 'Jordi' en los dos casos). FIX: la clave de agrupación pasa a ser monthKey+'|'+mgrName.trim().toLowerCase() (el NOMBRE ya resuelto, normalizado en minúsculas y sin espacios sobrantes) en vez del ID crudo — así todas las tareas que se muestran con el mismo nombre de Villa Manager en pantalla se agrupan en una sola fila, independientemente de qué ID interno de Caspio tengan detrás. Sin cambios en el resto de la agregación, filtros ni selector de mes. | v03 - FIX bug reportado por Jordi: la agrupación por Mes + Villa Manager mostraba 'Sin fecha' y, para un mismo Villa Manager, aparecían DOS filas en vez de una. Causa raíz (idéntica a la ya corregida en guardias-e-intervenciones.html v09): aggregate() extraía la fecha con (campo).split(' ')[0]||(campo).split('T')[0] — si TaTasks_Data_to_be_done_fixed venía con separador 'T' (ISO, sin espacio) en vez de espacio, split(' ')[0] devolvía la cadena COMPLETA con hora incluida (ej. '2026-08-07T00:00:00'), que al concatenarle otra vez 'T00:00:00' para construir el Date daba una cadena inválida ('2026-08-07T00:00:00T00:00:00') → Date inválido → la fila caía en el grupo 'sin-fecha'. Como no todas las tareas de un mismo Villa Manager tienen el campo guardado con el mismo separador, unas caían en el mes correcto y otras en 'Sin fecha', generando dos filas distintas para la misma persona. FIX: nueva función extractDateOnly() (regex ^(\d{4}-\d{2}-\d{2})), robusta sea cual sea el separador, usada en aggregate() en vez del split anterior — ahora todas las tareas de un Villa Manager con fecha válida se agrupan correctamente bajo el mismo mes, en una sola fila. Sin cambios en filtros, selector de mes ni resto de la agregación/render. | v02 - Cambio pedido por Jordi: las columnas de 'número de incidencias de cada tipo' (antes una columna por cada Tipo de intervención, con la mayoría de celdas a '—' porque cada Villa Manager solo suele tener 1-2 tipos distintos al mes) se sustituyen por UNA sola columna 'Tipos', que dentro de cada celda apila una línea por tipo — solo los tipos con cantidad distinta de 0 para ese Villa Manager ese mes, en formato '<strong>N</strong> Nombre' (ej. Juan → '2 Cerraduras' en una línea y '3 Otros' en la siguiente) — igual que en la fila de TOTALES, que suma esos mismos tipos across todas las filas filtradas. Nueva función tiposLinesHTML(porTipo,tiposCols) genera esas líneas (o '—' si el Villa Manager no tuvo ningún tipo ese mes); reemplaza el mapeo anterior de tipoCells/totalTipoCells (columna por tipo). Nuevas clases CSS .tipos-cell (white-space:normal para permitir el apilado, en vez del nowrap general de .report-table td) y .tipo-line. Sin cambios en la agregación (aggregate() sigue calculando porTipo igual que en v01) ni en los filtros/selector de mes — únicamente cambia cómo se pintan los tipos en la tabla. LIMPIEZA de huérfanos: ninguna (las funciones/variables sustituidas no se usan en ningún otro sitio del archivo). | v01 - Primera versión de la página. Listado-resumen (pivote Mes × Villa Manager) de guardias e intervenciones, con los MISMOS filtros que guardias-e-intervenciones.html v08 (buscar, estado Todas/Pendientes/Terminadas, villa manager multi-select, villa, nº tarea, id reserva, tipo de intervención, importante/urgente) contra la misma vista Caspio (Vi_TaTasks_villas_user_mu) y el mismo buildWhere() (idéntico, campos con prefijo TaTasks_). ÚNICA diferencia pedida: las fechas Desde/Hasta dejan de estar siempre visibles en la barra principal y pasan, en su lugar, a un selector de MES (‹ Agosto 2026 › en la barra principal, con botón central que vuelve al mes actual) que por defecto carga el mes en curso (día 1 a último día) y permite cambiar de mes con 1 clic; los campos Desde/Hasta originales se conservan dentro del panel colapsable 'Filtros' (renombrados 'fecha exacta') para quien quiera poner fechas concretas o un rango que no coincida con un mes completo — si el rango introducido a mano coincide exactamente con un mes completo, la etiqueta del selector se sincroniza sola; si no, muestra 'Rango personalizado'. Salida: en vez del listado de tarjetas de guardias-e-intervenciones.html, esta página muestra una tabla-resumen agrupada por Mes + Villa Manager con las columnas pedidas — Mes, Villa Manager, Nº guardias (registros con Intervencion_guardia_tipo_ID='guardia sin intervencion'), Nº intervenciones (el resto), Desplazamientos (nº de registros con Desplazamientos=true) y una columna por cada Tipo de intervención existente en la tabla lookup Ta_tipo_intervencion_guardia (excluyendo 'guardia sin intervencion', que ya tiene su propia columna) con el nº de incidencias de ese tipo — más una fila final TOTALES con la suma de todas las columnas numéricas de todo el resultado filtrado. Filas ordenadas por mes (ascendente) y, dentro de cada mes, por nombre de Villa Manager (A-Z); si algún registro no tiene fecha se agrupa aparte bajo 'Sin fecha'. Optimización de llamadas respecto al patrón de guardias-e-intervenciones.html: los filtros que SOLO afectan al cliente (Estado, Importante, Urgente) ya no disparan un nuevo fetch al Worker — se reprocesan sobre currentRows ya cargado (reprocess()); solo los filtros que cambian el WHERE del servidor (Buscar, Mes/fechas, Villa Manager, Villa, Nº Tarea, Id Reserva, Tipo) disparan scheduleFetch()→doSearch() con fetch nuevo. Barra de estadísticas simplificada a 3 contadores (guardias/intervenciones/desplazamientos) sobre el total ya agregado. Sin modal de creación/edición: página de solo lectura (consulta), no se crean ni modifican tareas desde aquí — para eso sigue existiendo guardias-e-intervenciones.html. NOTA IMPORTANTE PENDIENTE: esta página usa Auth.require('listado-guardias-e-intervenciones'), una clave que TODAVÍA NO EXISTE en auth.js — hay que añadir la entrada de permisos correspondiente antes de desplegar esta página o Auth.require lanzará 'Sin permiso' para todos los usuarios (se entrega la línea exacta a añadir en cuanto se confirme). -->
